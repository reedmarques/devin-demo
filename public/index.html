<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Devin — Internal Tools</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1><img class="brand-logo" src="/devin-logo.svg" alt="Devin" width="125" height="43" /><span class="brand-sub">Internal tools</span></h1>
      <nav aria-label="Internal tools">
        <button class="nav-item active" data-app="refunds">Refunds</button>
        <button class="nav-item" data-app="flags">Flag admin</button>
      </nav>
    </div>
    <div class="actor-switcher">
      <label for="actor">Acting as</label>
      <select id="actor"></select>
      <span id="actor-role" class="badge"></span>
    </div>
  </header>
  <main id="app"></main>
  <footer class="site-footer">Contributor: <a href="https://github.com/reedmarques">reedmarques</a></footer>
  <script src="/app.js"></script>
</body>
</html>
